name: Build Windows VST3
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S ABRAX -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target ABRAX_VST3 --parallel 4
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: ABRAX-Windows-VST3
          path: build/ABRAX_artefacts/Release/VST3/ABRAX.vst3/
          if-no-files-found: error
